<template>
    <div class="page">
        <lightning-card title={title}>
            <div class="content slds-p-horizontal_medium slds-p-bottom_medium">
            <div class="toolbar slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                <div></div>
                <lightning-button-icon
                    icon-name="utility:refresh"
                    alternative-text="Refresh"
                    title="Refresh"
                    onclick={handleRefresh}
                ></lightning-button-icon>
            </div>

            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="Loading gift entries"></lightning-spinner>
            </template>

            <template lwc:elseif={missingRecordId}>
                <div class="slds-notify slds-notify_alert slds-alert_warning" role="alert">
                    <span class="slds-assistive-text">Warning</span>
                    <h2>{missingContextMessage}</h2>
                </div>
            </template>

            <template lwc:elseif={errors}>
                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    <h2>Unable to load gift entries.</h2>
                </div>
                <ul class="error-list slds-m-top_small">
                    <template for:each={errorMessages} for:item="message">
                        <li key={message}>{message}</li>
                    </template>
                </ul>
            </template>

            <template lwc:elseif={hasEntries}>
                <div class="entry-list">
                    <template for:each={entries} for:item="entry">
                        <section key={entry.id} class="entry-block">
                            <div class="entry-header">
                                <div class="entry-title">
                                    <lightning-icon
                                        icon-name="standard:gift_entry"
                                        size="small"
                                        alternative-text="Gift Entry"
                                    ></lightning-icon>
                                    <a href={entry.id} target="_blank">{entry.name}</a>
                                </div>
                            </div>

                            <div class="gift-grid" role="table" aria-label="Gift entry details">
                                <div class="grid-heading" role="row">
                                    <span role="columnheader">Donor</span>
                                    <span role="columnheader">Gift Received Date</span>
                                    <span role="columnheader">Gift Amount</span>
                                    <span role="columnheader">Payment Method</span>
                                    <span role="columnheader">Designation</span>
                                </div>
                                <div class="grid-row" role="row">
                                    <span role="cell">{entry.donor}</span>
                                    <span role="cell">{entry.giftReceivedDate}</span>
                                    <span role="cell">{entry.giftAmount}</span>
                                    <span role="cell">{entry.paymentMethod}</span>
                                    <span role="cell">{entry.designation}</span>
                                </div>
                            </div>

                            <template lwc:if={entry.isAssetEntry}>
                                <c-gift-entry-asset-post-processing
                                    entry-id={entry.id}
                                    gift-transaction-id={entry.giftTransactionId}
                                    assets={entry.assets}
                                    onassetdirtycountchange={handleAssetDirtyCountChange}
                                    onassetsaved={handleAssetSaved}
                                    onasseterror={handleAssetError}
                                ></c-gift-entry-asset-post-processing>
                            </template>

                            <template lwc:if={entry.isStockEntry}>
                                <c-gift-entry-stock-post-processing
                                    entry-id={entry.id}
                                    gift-transaction-id={entry.giftTransactionId}
                                    stocks={entry.stocks}
                                    onstockdirtycountchange={handleStockDirtyCountChange}
                                    onstocksaved={handleStockSaved}
                                    onstockerror={handleStockError}
                                ></c-gift-entry-stock-post-processing>
                            </template>
                        </section>
                    </template>
                </div>
            </template>

            <template lwc:elseif={showEmptyState}>
                <div class="empty-state slds-text-align_center slds-p-around_large">
                    <lightning-icon
                        icon-name="utility:info"
                        size="small"
                        alternative-text="No records"
                    ></lightning-icon>
                    <p class="slds-m-top_small">
                        {emptyStateMessage}
                    </p>
                </div>
            </template>

            <div class="footer">
                <template lwc:if={hasDirtyRecords}>
                    <span class="pending-count slds-text-body_small slds-text-color_weak">
                        {dirtyRecordCount} unsaved post-processing change(s)
                    </span>
                </template>
                <lightning-button
                    variant="brand"
                    icon-name="utility:save"
                    label="Save All"
                    disabled={isSaveAllDisabled}
                    onclick={handleSaveAll}
                ></lightning-button>
                <lightning-button label="Close" onclick={handleClose}></lightning-button>
            </div>
            </div>
        </lightning-card>
    </div>
</template>
